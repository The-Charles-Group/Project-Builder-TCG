# Ruff configuration for Agency Project Builder
# Catches undefined variables and other critical issues

# Target Python 3.11
target-version = "py311"

# Enable specific rules
[lint]
select = [
    "F",      # Pyflakes (undefined names, unused imports)
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings  
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade (Python version compatibility)
]

# Critical rules that should NEVER be ignored
ignore = [
    "E501",   # Line too long (handled by formatter)
    "E741",   # Ambiguous variable name (df is common in pandas)
]

# Show fixes for auto-fixable violations
fixable = ["ALL"]
unfixable = []

# Exclude auto-generated or vendor code
exclude = [
    ".git",
    "__pycache__",
    ".pythonlibs",
    "venv",
    ".venv",
    "build",
    "dist",
]

# Rules per file
[lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

# Formatting (optional, but recommended)
[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# CRITICAL: Undefined variable detection (F821)
# This is the rule that would have caught the comp_duration bug
# Run: ruff check --select F821 main.py
