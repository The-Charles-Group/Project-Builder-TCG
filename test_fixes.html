<!DOCTYPE html>
<html>
<head>
  <title>Test UI Fixes</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
    .success { color: green; }
    .fail { color: red; }
    pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Testing Agency Project Builder UI Fixes</h1>
  
  <div class="test-section">
    <h2>Test Setup</h2>
    <button onclick="setupTest()">Setup Test Data & Go to Step 2</button>
    <div id="setup-status"></div>
  </div>

  <div class="test-section">
    <h2>Test Results</h2>
    <div id="test-results"></div>
  </div>

  <script>
    // Sample RFP text for testing
    const sampleRFP = `
      AGENCY RFP - Digital Marketing Campaign
      
      We need a comprehensive digital marketing campaign including:
      - SEO Strategy and Implementation
      - Paid Media Planning and Buying
      - Social Media Management
      - Content Creation and Planning
      - Performance Reporting
      - Campaign Strategy Development
      
      Duration: 12 months with potential for renewal
      Budget: $500K
      Start Date: January 2025
    `;

    async function setupTest() {
      const status = document.getElementById('setup-status');
      status.innerHTML = 'Setting up test...';
      
      // Open the main app in a new window
      const appWindow = window.open('/', 'app', 'width=1400,height=900');
      
      // Wait for app to load
      await new Promise(resolve => setTimeout(resolve, 2000));
      
      // Set RFP text
      appWindow.document.getElementById('rfpText').value = sampleRFP;
      
      // Click Analyze button
      appWindow.document.getElementById('btnAnalyze').click();
      
      status.innerHTML = 'Analysis started. Wait for Step 2 to appear...';
      
      // Wait for analysis to complete
      await new Promise(resolve => setTimeout(resolve, 5000));
      
      // Check if Step 2 is visible
      if (appWindow.document.getElementById('step2').style.display !== 'none') {
        status.innerHTML = '<span class="success">✓ Step 2 is now visible. Ready for testing!</span>';
        
        // Run the tests
        setTimeout(() => runTests(appWindow), 2000);
      } else {
        status.innerHTML = '<span class="fail">✗ Step 2 not visible yet. Please wait and try again.</span>';
      }
    }

    function runTests(appWindow) {
      const results = document.getElementById('test-results');
      let testResults = [];
      
      // Test 1: Check if retainer options are visible in "Selected" deliverables
      const selectedDelivs = appWindow.document.querySelectorAll('#step2 .deliv-row[data-code] .retainer-toggle');
      const test1Pass = selectedDelivs.length > 0;
      testResults.push({
        name: 'Test 1: Retainer options in Selected deliverables',
        pass: test1Pass,
        details: `Found ${selectedDelivs.length} retainer toggles in Selected section`
      });
      
      // Test 2: Check if retainer options are visible in "Other" deliverables  
      const otherDelivs = appWindow.document.querySelectorAll('#step2 .deliv-row .retainer-toggle');
      const test2Pass = otherDelivs.length > selectedDelivs.length;
      testResults.push({
        name: 'Test 2: Retainer options in Other deliverables',
        pass: test2Pass,
        details: `Total retainer toggles found: ${otherDelivs.length}`
      });
      
      // Test 3: Check if populateAllL2Tasks function exists
      const test3Pass = typeof appWindow.populateAllL2Tasks === 'function';
      testResults.push({
        name: 'Test 3: populateAllL2Tasks function exists',
        pass: test3Pass,
        details: test3Pass ? 'Function is available globally' : 'Function not found'
      });
      
      // Test 4: Check if L2 tasks panel header can show "All L2 Tasks"
      const tasksHeader = appWindow.document.getElementById('s2-tasks-active-component');
      const test4Pass = tasksHeader !== null;
      testResults.push({
        name: 'Test 4: L2 Tasks header element exists',
        pass: test4Pass,
        details: tasksHeader ? `Current text: "${tasksHeader.textContent}"` : 'Element not found'
      });
      
      // Display results
      let html = '<h3>Test Results:</h3><ul>';
      testResults.forEach(result => {
        const icon = result.pass ? '✓' : '✗';
        const className = result.pass ? 'success' : 'fail';
        html += `<li class="${className}">${icon} ${result.name}<br><small>${result.details}</small></li>`;
      });
      html += '</ul>';
      
      // Summary
      const passed = testResults.filter(r => r.pass).length;
      const total = testResults.length;
      html += `<h3>Summary: ${passed}/${total} tests passed</h3>`;
      
      if (passed === total) {
        html += '<p class="success"><strong>All tests passed! Both fixes are working correctly.</strong></p>';
      } else {
        html += '<p class="fail"><strong>Some tests failed. Please check the implementation.</strong></p>';
      }
      
      results.innerHTML = html;
    }
  </script>
</body>
</html>
