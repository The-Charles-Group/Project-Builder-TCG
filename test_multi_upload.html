<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHARLES Multi-File Upload Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 40px;
            background: #1a1a2e;
            color: white;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #8b5cf6;
        }
        .test-section {
            background: rgba(139, 92, 246, 0.1);
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }
        button {
            background: #8b5cf6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #7c3aed;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.3);
        }
        .success {
            border-left: 4px solid #10b981;
        }
        .error {
            border-left: 4px solid #ef4444;
        }
        .info {
            border-left: 4px solid #3b82f6;
        }
        pre {
            background: black;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🔮 CHARLES Agent Multi-File Upload Test Suite</h1>
        
        <div class="test-section">
            <h2>Test 1: Basic Agent Communication</h2>
            <button onclick="testBasicChat()">Test Basic Chat</button>
            <div id="test1-status" class="status info">Ready to test...</div>
        </div>
        
        <div class="test-section">
            <h2>Test 2: Command Execution</h2>
            <button onclick="testCommand('show pricing')">Navigate to Pricing</button>
            <button onclick="testCommand('add all strategy deliverables')">Add Strategy Deliverables</button>
            <button onclick="testCommand('calculate total cost')">Calculate Total</button>
            <div id="test2-status" class="status info">Ready to test...</div>
        </div>
        
        <div class="test-section">
            <h2>Test 3: Document Upload Simulation</h2>
            <button onclick="testDocumentSubmission()">Test Submit Document Command</button>
            <div id="test3-status" class="status info">Ready to test...</div>
        </div>
        
        <div class="test-section">
            <h2>Test 4: Multi-Step Workflow</h2>
            <button onclick="testWorkflow()">Test Complete Workflow</button>
            <div id="test4-status" class="status info">Ready to test...</div>
        </div>
        
        <div class="test-section">
            <h2>Results</h2>
            <pre id="results">No results yet...</pre>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:5000';
        
        async function testBasicChat() {
            const statusEl = document.getElementById('test1-status');
            statusEl.className = 'status info';
            statusEl.textContent = 'Testing basic chat...';
            
            try {
                const response = await fetch(`${API_BASE}/api/agent/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: 'Hello CHARLES, are you ready?',
                        tier: 'mini'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    statusEl.className = 'status success';
                    statusEl.textContent = `✅ Basic chat working! Response time: ${(data.execution_time * 1000).toFixed(2)}ms`;
                    updateResults('Test 1', data);
                } else {
                    statusEl.className = 'status error';
                    statusEl.textContent = '❌ Chat failed: ' + (data.error || 'Unknown error');
                }
            } catch (error) {
                statusEl.className = 'status error';
                statusEl.textContent = '❌ Error: ' + error.message;
            }
        }
        
        async function testCommand(command) {
            const statusEl = document.getElementById('test2-status');
            statusEl.className = 'status info';
            statusEl.textContent = `Testing command: "${command}"...`;
            
            try {
                const response = await fetch(`${API_BASE}/api/agent/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: command,
                        tier: 'mini'
                    })
                });
                
                const data = await response.json();
                
                if (data.success && data.command) {
                    statusEl.className = 'status success';
                    statusEl.textContent = `✅ Command recognized: ${data.command.type} (${data.command.parsing_method}) - ${(data.execution_time * 1000).toFixed(2)}ms`;
                    updateResults('Test 2: ' + command, data);
                } else {
                    statusEl.className = 'status error';
                    statusEl.textContent = '❌ Command not recognized';
                }
            } catch (error) {
                statusEl.className = 'status error';
                statusEl.textContent = '❌ Error: ' + error.message;
            }
        }
        
        async function testDocumentSubmission() {
            const statusEl = document.getElementById('test3-status');
            statusEl.className = 'status info';
            statusEl.textContent = 'Testing document submission command...';
            
            try {
                const response = await fetch(`${API_BASE}/api/agent/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: 'submit the uploaded documents for analysis',
                        tier: 'thinking-mini'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    statusEl.className = 'status success';
                    statusEl.textContent = `✅ Submission command processed: ${data.command?.type || 'unknown'}`;
                    updateResults('Test 3', data);
                } else {
                    statusEl.className = 'status error';
                    statusEl.textContent = '❌ Submission failed';
                }
            } catch (error) {
                statusEl.className = 'status error';
                statusEl.textContent = '❌ Error: ' + error.message;
            }
        }
        
        async function testWorkflow() {
            const statusEl = document.getElementById('test4-status');
            statusEl.className = 'status info';
            statusEl.textContent = 'Testing multi-step workflow...';
            
            const steps = [
                { message: 'analyze the RFP', tier: 'thinking-mini' },
                { message: 'select top 10 deliverables by value', tier: 'thinking' },
                { message: 'generate timeline', tier: 'pro' }
            ];
            
            const results = [];
            
            for (const step of steps) {
                try {
                    const response = await fetch(`${API_BASE}/api/agent/chat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(step)
                    });
                    
                    const data = await response.json();
                    results.push({
                        step: step.message,
                        success: data.success,
                        command: data.command?.type,
                        time: data.execution_time
                    });
                    
                    statusEl.textContent = `Processing: ${step.message}...`;
                } catch (error) {
                    results.push({
                        step: step.message,
                        success: false,
                        error: error.message
                    });
                }
            }
            
            const successCount = results.filter(r => r.success).length;
            if (successCount === steps.length) {
                statusEl.className = 'status success';
                statusEl.textContent = `✅ All ${steps.length} workflow steps completed successfully!`;
            } else {
                statusEl.className = 'status error';
                statusEl.textContent = `⚠️ ${successCount}/${steps.length} steps completed`;
            }
            
            updateResults('Test 4: Workflow', results);
        }
        
        function updateResults(test, data) {
            const resultsEl = document.getElementById('results');
            const currentResults = resultsEl.textContent === 'No results yet...' ? '' : resultsEl.textContent;
            resultsEl.textContent = currentResults + '\n\n' + test + ':\n' + JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
