<!DOCTYPE html>
<html>
<head>
    <title>Test CHARLES</title>
    <style>
        body {
            background: #2a2a2a;
            color: white;
            font-family: system-ui;
            padding: 20px;
        }
        #status {
            padding: 20px;
            border: 2px solid #666;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>CHARLES Test Page</h1>
    <div id="status">
        <h2>Status</h2>
        <ul id="log"></ul>
    </div>
    
    <button onclick="testCharles()">Manual Test</button>
    
    <script>
        function log(msg) {
            const li = document.createElement('li');
            li.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            document.getElementById('log').appendChild(li);
            console.log(msg);
        }
        
        log('Page loaded');
        
        function testCharles() {
            log('Testing CHARLES...');
            
            // Try to create a simple toggle button
            const btn = document.createElement('button');
            btn.style.cssText = `
                position: fixed;
                right: 20px;
                bottom: 20px;
                z-index: 99999;
                padding: 12px 20px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                border: none;
                border-radius: 12px;
                cursor: pointer;
                font-size: 14px;
                font-weight: 600;
                box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
            `;
            btn.innerHTML = '🔮 CHARLES TEST';
            btn.onclick = () => alert('CHARLES button clicked!');
            document.body.appendChild(btn);
            log('Test button created and appended');
        }
    </script>
    
    <!-- Load the AI assistant script -->
    <script src="/static/ai_assistant.js"></script>
    
    <script>
        // Check if AI assistant loaded
        setTimeout(() => {
            if (window.AIAssistant) {
                log('✅ AIAssistant class is available');
            } else {
                log('❌ AIAssistant class NOT available');
            }
            
            if (window.aiAssistant) {
                log('✅ aiAssistant instance exists');
            } else {
                log('❌ aiAssistant instance NOT created');
            }
            
            const toggle = document.getElementById('ai-assistant-toggle');
            if (toggle) {
                log('✅ Toggle button found in DOM');
            } else {
                log('❌ Toggle button NOT found in DOM');
            }
            
            const container = document.getElementById('ai-assistant-container');
            if (container) {
                log('✅ Container found in DOM');
            } else {
                log('❌ Container NOT found in DOM');
            }
        }, 2000);
    </script>
</body>
</html>
